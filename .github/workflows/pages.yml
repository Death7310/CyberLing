name: Deploy to GitHub Pages

# Publishes the PWA at https://<owner>.github.io/<repo>/ on every push to the main development branch.
# GitHub Pages must be enabled for the repository with source "GitHub Actions"
# (Settings → Pages); configure-pages tries to enable it automatically.
on:
  push:
    branches: [main, master, 'claude/coding-education-platform-2uehb0']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with the Pages base path
        run: npm run prepare:pyodide && npx vite build --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
