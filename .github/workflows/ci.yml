name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Test and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Unit, content and executed-solution tests
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Build relocatable copy (for static hosts)
        run: npm run build:artifact
      - uses: actions/upload-artifact@v4
        with:
          name: cyberling-web
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: cyberling-web-relocatable
          path: dist-artifact

  android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build web assets and sync into the Android project
        run: npm run build && npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cyberling-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
