name: Release builds

# Publishes direct-download installers to a GitHub Release.
#  - Manual run (Actions → Release builds → Run workflow) updates the rolling "nightly" pre-release.
#  - Pushing a tag like v0.2.0 creates a versioned release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CyberLing-android-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: release-android, path: CyberLing-android-debug.apk }

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:artifact
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, desktop]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - name: Rolling nightly pre-release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: |
            Latest development build from `${{ github.ref_name }}` (commit ${{ github.sha }}).

            - Android: `CyberLing-android-debug.apk` (allow installs from your browser when prompted)
            - macOS: `.dmg` (unsigned: right-click → Open the first time)
            - Windows: `.exe` installer or portable (unsigned: SmartScreen → More info → Run anyway)
            - Linux: `.AppImage`
          files: files/*
      - name: Versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: files/*
